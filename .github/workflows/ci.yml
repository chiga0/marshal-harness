name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Release authority runs before any candidate Make target, script, toolchain
      # setup or GITHUB_ENV write. Keep all executables and environment explicit.
      - name: Run release contract gate
        if: matrix.os == 'ubuntu-latest'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          MAKEFLAGS: ''
          PATH: /usr/bin:/bin
          PYTHONHOME: ''
          PYTHONPATH: ''
        run: |
          checker="$GITHUB_WORKSPACE/scripts/release-ci-contract.py"
          run_checker() {
            /usr/bin/env -i \
              LC_ALL=C \
              PATH=/usr/bin:/bin \
              /usr/bin/python3 -I -B "$checker" "$GITHUB_WORKSPACE"
          }
          run_checker
          for test_path in \
            scripts/release-ci-gate_test.sh \
            scripts/install_test.sh \
            scripts/release-canary_test.sh \
            scripts/fixed-server-t1-canary_test.sh \
            scripts/m13-e2e-dogfood-workflow_test.sh; do
            run_checker
            /usr/bin/env -i \
              LC_ALL=C \
              PATH=/usr/bin:/bin \
              /bin/bash --noprofile --norc "$GITHUB_WORKSPACE/$test_path"
          done
          run_checker
          /usr/bin/env -i \
            LC_ALL=C \
            PATH=/usr/bin:/bin \
            /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/fixed-server-t1-evidence_test.py"
          run_checker
          /usr/bin/env -i \
            LC_ALL=C \
            PATH=/usr/bin:/bin \
            /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/rc1-carrier-check_test.py"
          run_checker
          /usr/bin/env -i \
            LC_ALL=C \
            PATH=/usr/bin:/bin \
            /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/rc1-release-carrier-artifact_test.py"
          run_checker

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      # RC1 distribution validation builds and ad-hoc signs the real
      # Darwin/arm64 candidate with the fixed /usr/bin/codesign required by
      # the release contract. It therefore runs on macOS after setup-go has
      # installed the exact go.mod toolchain; Linux still runs the complete
      # source quality gate below.
      - name: Run distribution contracts
        if: matrix.os == 'macos-latest'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          checker="$GITHUB_WORKSPACE/scripts/release-ci-contract.py"
          run_checker() {
            /usr/bin/env -i \
              LC_ALL=C \
              PATH=/usr/bin:/bin \
              /usr/bin/python3 -I -B "$checker" "$GITHUB_WORKSPACE"
          }
          for test_path in \
            scripts/release-contract_test.sh \
            scripts/dist-profile_test.sh; do
            run_checker
            /bin/bash --noprofile --norc "$GITHUB_WORKSPACE/$test_path"
          done
          run_checker

      - name: Run quality gate
        run: make check

      - name: Run vulnerability scan
        run: make vuln

  linux-candidate:
    name: Linux candidate conformance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bind this independently scheduled native runner to the exact reviewed
      # CI contract before setup-go or any candidate-producing command.
      - name: Run release contract gate
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          MAKEFLAGS: ''
          PATH: /usr/bin:/bin
          PYTHONHOME: ''
          PYTHONPATH: ''
        run: |
          /usr/bin/env -i \
            LC_ALL=C \
            PATH=/usr/bin:/bin \
            /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/release-ci-contract.py" \
            "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      # This gate proves only release-shaped Linux artifact mechanics. Both
      # native binaries remain selfProfile=unprofiled and carry no stable
      # runtime, rollback/high-water, signing, or publication authority.
      - name: Run native Linux candidate artifact conformance
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: bash scripts/linux-candidate-conformance.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
