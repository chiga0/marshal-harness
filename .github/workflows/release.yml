name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 精确 annotated RC1 tag（只接受 v1.0.0-rc1）
        required: true
        type: string
      carrier-run-id:
        description: exact-head 成功 RC1 finalize workflow run_id
        required: true
        type: string
      carrier-artifact-id:
        description: finalize run 上传的 immutable carrier artifact id
        required: true
        type: string
      carrier-artifact-digest:
        description: carrier artifact 的 raw lowercase SHA-256
        required: true
        type: string
      receipt-digest:
        description: 独立记录的 RC1 canary receipt raw lowercase SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit exact same-bytes RC1 carrier
    runs-on: macos-14
    environment: release-candidate-build
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      source-head: ${{ steps.release.outputs.source-head }}
      tag-object: ${{ steps.release.outputs.tag-object }}
      payload-sha256: ${{ steps.payload.outputs.sha256 }}
      payload-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      payload-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      TAG_NAME: ${{ inputs.tag }}
      CARRIER_RUN_ID: ${{ inputs.carrier-run-id }}
      CARRIER_ARTIFACT_ID: ${{ inputs.carrier-artifact-id }}
      CARRIER_ARTIFACT_DIGEST: ${{ inputs.carrier-artifact-digest }}
      EXPECTED_RECEIPT_DIGEST: ${{ inputs.receipt-digest }}
    steps:
      - name: Checkout exact annotated RC1 tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Go toolchain for binary inspection only
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Validate release identity and immutable inputs
        id: release
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          test "${{ github.repository }}" = "chiga0/marshal-harness" || { echo "::error::仅允许 canonical 仓库" >&2; exit 1; }
          [ "$TAG_NAME" = v1.0.0-rc1 ] || { echo "::error::当前 workflow 只允许 v1.0.0-rc1" >&2; exit 1; }
          [[ "$CARRIER_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::carrier-run-id 非 canonical 正整数" >&2; exit 1; }
          [[ "$CARRIER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::carrier-artifact-id 非 canonical 正整数" >&2; exit 1; }
          [[ "$CARRIER_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::carrier artifact digest 非 raw lowercase SHA-256" >&2; exit 1; }
          [[ "$EXPECTED_RECEIPT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::receipt digest 非 raw lowercase SHA-256" >&2; exit 1; }
          [ "$(bash scripts/release-contract.sh classify "$TAG_NAME")" = prerelease ]
          test "$(git cat-file -t "refs/tags/${TAG_NAME}")" = tag || { echo "::error::RC1 必须使用 annotated tag" >&2; exit 1; }
          tag_object="$(git rev-parse --verify "refs/tags/${TAG_NAME}")"
          release_head="$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")"
          [ "$(git rev-parse HEAD)" = "$release_head" ] || { echo "::error::checkout 与 peeled tag commit 漂移" >&2; exit 1; }
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]] && [[ "$release_head" =~ ^[0-9a-f]{40}$ ]]
          echo "source-head=$release_head" >> "$GITHUB_OUTPUT"
          echo "tag-object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "RELEASE_HEAD=$release_head" >> "$GITHUB_ENV"

      - name: Require exact-head CI success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: bash scripts/release-ci-gate.sh "${{ github.repository }}" "$RELEASE_HEAD"

      - name: Download and safely restore exact canary carrier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          run_meta="$RUNNER_TEMP/rc1-finalize-run.json"
          artifact_meta="$RUNNER_TEMP/rc1-carrier-artifact.json"
          archive="$RUNNER_TEMP/rc1-carrier.zip"
          carrier_dir="$RUNNER_TEMP/rc1-release-carrier"
          gh api "repos/${{ github.repository }}/actions/runs/${CARRIER_RUN_ID}" > "$run_meta"
          gh api "repos/${{ github.repository }}/actions/artifacts/${CARRIER_ARTIFACT_ID}" > "$artifact_meta"
          gh api "repos/${{ github.repository }}/actions/artifacts/${CARRIER_ARTIFACT_ID}/zip" > "$archive"
          evidence_run_id="$(python3 -I -B scripts/rc1-release-carrier-artifact.py \
            "$run_meta" "$artifact_meta" "$archive" "$carrier_dir" \
            "$CARRIER_RUN_ID" "$CARRIER_ARTIFACT_ID" "$CARRIER_ARTIFACT_DIGEST" "$RELEASE_HEAD")"
          [[ "$evidence_run_id" =~ ^[1-9][0-9]*$ ]] || { echo "::error::candidate evidence run id 非 canonical" >&2; exit 1; }
          receipt="$carrier_dir/RC1-CANARY-RECEIPT.json"
          candidate_artifact_id="$(jq -r '.candidateWorkflow.artifactId' "$receipt")"
          candidate_artifact_digest="$(jq -r '.candidateWorkflow.artifactDigest' "$receipt" | sed 's/^sha256://')"
          authority_head="$(jq -r '.authority.currentHeadDigest' "$receipt")"
          python3 -I -B scripts/rc1-carrier-check.py \
            "$carrier_dir" "$RELEASE_HEAD" "$evidence_run_id" \
            "$candidate_artifact_id" "$candidate_artifact_digest" \
            "$authority_head" "$EXPECTED_RECEIPT_DIGEST"
          GO_BIN="$(go env GOROOT)/bin/go" bash scripts/release-contract.sh verify-candidate-tag \
            . "$carrier_dir" "$TAG_NAME"
          echo "CARRIER_DIR=$carrier_dir" >> "$GITHUB_ENV"

      - name: Freeze the admitted carrier without rebuilding candidate bytes
        id: payload
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          COPYFILE_DISABLE=1 /usr/bin/tar -cf release-payload.tar -C "$CARRIER_DIR" \
            RC1-CANARY-RECEIPT.json RELEASE-MANIFEST SHA256SUMS marshal_1.0.0-rc1_darwin_arm64
          payload_sha="$(shasum -a 256 release-payload.tar | awk '{print tolower($1)}')"
          printf '%s  release-payload.tar\n' "$payload_sha" > RELEASE-PAYLOAD.sha256
          echo "sha256=$payload_sha" >> "$GITHUB_OUTPUT"

      - name: Upload digest-bound admitted RC1 payload
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-payload-${{ steps.release.outputs.source-head }}
          path: |
            release-payload.tar
            RELEASE-PAYLOAD.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish admitted unsigned RC1 prerelease
    needs: admit
    runs-on: ubuntu-latest
    environment: release-publication
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      TAG_NAME: ${{ inputs.tag }}
      EXPECTED_RECEIPT_DIGEST: ${{ inputs.receipt-digest }}
      EXPECTED_SOURCE_HEAD: ${{ needs.admit.outputs.source-head }}
      EXPECTED_TAG_OBJECT: ${{ needs.admit.outputs.tag-object }}
      EXPECTED_PAYLOAD_SHA256: ${{ needs.admit.outputs.payload-sha256 }}
      EXPECTED_PAYLOAD_ARTIFACT_ID: ${{ needs.admit.outputs.payload-artifact-id }}
      EXPECTED_PAYLOAD_ARTIFACT_DIGEST: ${{ needs.admit.outputs.payload-artifact-digest }}
      EXPECTED_WORKFLOW_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact release tag without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout validators from the exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-validator
          fetch-depth: 1
          persist-credentials: false

      - name: Download, bind, and recheck admitted same-bytes payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          test "${{ github.repository }}" = "chiga0/marshal-harness"
          [[ "$EXPECTED_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_PAYLOAD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_PAYLOAD_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_WORKFLOW_HEAD" =~ ^[0-9a-f]{40}$ ]]
          metadata_file="$(mktemp "${RUNNER_TEMP}/marshal-release-artifact.XXXXXX")"
          archive_file="$(mktemp "${RUNNER_TEMP}/marshal-release-archive.XXXXXX")"
          artifact_dir="$(mktemp -d "${RUNNER_TEMP}/marshal-release-extract.XXXXXX")"
          release_dir="$(mktemp -d "${RUNNER_TEMP}/marshal-release-carrier.XXXXXX")"
          trap 'rm -f "$metadata_file" "$archive_file"; rm -rf "$artifact_dir"' EXIT
          gh api "repos/${{ github.repository }}/actions/artifacts/${EXPECTED_PAYLOAD_ARTIFACT_ID}" > "$metadata_file"
          gh api "repos/${{ github.repository }}/actions/artifacts/${EXPECTED_PAYLOAD_ARTIFACT_ID}/zip" > "$archive_file"
          python3 -I -B .release-validator/scripts/release-artifact-metadata-check.py \
            "$metadata_file" "$archive_file" "$artifact_dir" \
            "$EXPECTED_PAYLOAD_ARTIFACT_ID" "$EXPECTED_PAYLOAD_ARTIFACT_DIGEST" \
            "$EXPECTED_SOURCE_HEAD" "$EXPECTED_WORKFLOW_HEAD" "${{ github.run_id }}"
          test "$(sha256sum "${artifact_dir}/release-payload.tar" | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          (cd "$artifact_dir" && sha256sum -c RELEASE-PAYLOAD.sha256)
          python3 -I -B scripts/rc1-release-payload-extract.py \
            "${artifact_dir}/release-payload.tar" "$release_dir"
          receipt="$release_dir/RC1-CANARY-RECEIPT.json"
          evidence_run_id="$(jq -r '.candidateWorkflow.runId' "$receipt")"
          candidate_artifact_id="$(jq -r '.candidateWorkflow.artifactId' "$receipt")"
          candidate_artifact_digest="$(jq -r '.candidateWorkflow.artifactDigest' "$receipt" | sed 's/^sha256://')"
          authority_head="$(jq -r '.authority.currentHeadDigest' "$receipt")"
          python3 -I -B scripts/rc1-carrier-check.py \
            "$release_dir" "$EXPECTED_SOURCE_HEAD" "$evidence_run_id" \
            "$candidate_artifact_id" "$candidate_artifact_digest" \
            "$authority_head" "$EXPECTED_RECEIPT_DIGEST"
          test "$(git cat-file -t "refs/tags/${TAG_NAME}")" = tag
          test "$(git rev-parse --verify "refs/tags/${TAG_NAME}")" = "$EXPECTED_TAG_OBJECT"
          test "$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")" = "$EXPECTED_SOURCE_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          bash scripts/release-contract.sh verify-candidate-tag . "$release_dir" "$TAG_NAME"
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Generate mandatory negative-claim release notes
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          cat > release-notes.md <<'EOF'
          `v1.0.0-rc1` 是 unsigned、Mac-first、Darwin arm64、CLI-only 的 `darwin-local-dogfood` 生命周期预览，仅支持当前可信用户与可信仓库中的 `publication:none` 本地运行；它不是 production、managed、notarized、hardened、server 或 Linux release。

          安装必须显式设置 `MARSHAL_TAG=v1.0.0-rc1` 与 `MARSHAL_LOCAL_DOGFOOD_PREVIEW=1`。安装器会校验 annotated tag、`RELEASE-MANIFEST`、`SHA256SUMS` 和 candidate bytes；不会关闭 Gatekeeper/SIP/EDR，不会自动创建 activation，也不会回退源码构建。

          本 prerelease 的 candidate 已由真实 Pi 0.84.4 经 fixed Marshal CLI、Local allocation、ResultIngress、独立 Verification 与独立 ReviewDecision 到达 `ACCEPTED`。随 release 发布的 `RC1-CANARY-RECEIPT.json` 提供 sourceHead、candidate、Evidence、Decision、Outcome 和原 canary artifact 的 digest 绑定。
          EOF

      - name: Create GitHub prerelease from exact admitted carrier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          gh release create "$TAG_NAME" \
            --verify-tag \
            --prerelease \
            --title "Marshal $TAG_NAME — unsigned Mac-first CLI-only preview" \
            --notes-file release-notes.md \
            "$RELEASE_DIR/RELEASE-MANIFEST" \
            "$RELEASE_DIR/SHA256SUMS" \
            "$RELEASE_DIR/marshal_1.0.0-rc1_darwin_arm64" \
            "$RELEASE_DIR/RC1-CANARY-RECEIPT.json"
