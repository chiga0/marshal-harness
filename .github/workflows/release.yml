name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 v* tag（留空则取触发 ref）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      source-head: ${{ steps.release.outputs.source-head }}
      tag-object: ${{ steps.release.outputs.tag-object }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      payload-sha256: ${{ steps.payload.outputs.sha256 }}
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Test release and installer contracts
        run: |
          bash scripts/release-contract_test.sh
          bash scripts/release-ci-gate_test.sh
          bash scripts/dist-profile_test.sh
          bash scripts/install_test.sh
          bash scripts/release-canary_test.sh

      - name: Validate release source
        id: release
        run: |
          test "${{ github.repository }}" = "chiga0/marshal-harness" || {
            echo "::error::release workflow 只允许 canonical chiga0/marshal-harness" >&2
            exit 1
          }
          kind="$(bash scripts/release-contract.sh classify "$TAG_NAME")"
          test "$(git cat-file -t "refs/tags/${TAG_NAME}")" = tag || {
            echo "::error::release tag ${TAG_NAME} 必须是 annotated tag" >&2
            exit 1
          }
          release_tag_object="$(git rev-parse --verify "refs/tags/${TAG_NAME}")" \
            || { echo "::error::release tag ${TAG_NAME} 缺少 tag object" >&2; exit 1; }
          [[ "$release_tag_object" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release tag object ${release_tag_object} 非 canonical SHA" >&2
            exit 1
          }
          release_commit="$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")" \
            || { echo "::error::release tag ${TAG_NAME} 不存在或不指向 commit" >&2; exit 1; }
          checkout_commit="$(git rev-parse HEAD)"
          test "$checkout_commit" = "$release_commit" || {
            echo "::error::checkout ${checkout_commit} 与 tag ${TAG_NAME} 指向 ${release_commit} 不一致" >&2
            exit 1
          }
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [ "$kind" = "prerelease" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "source-head=$release_commit" >> "$GITHUB_OUTPUT"
          echo "tag-object=$release_tag_object" >> "$GITHUB_OUTPUT"
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
          build_date="$(bash scripts/release-contract.sh build-date . "$release_commit")"
          echo "RELEASE_BUILD_DATE=$build_date" >> "$GITHUB_ENV"

      - name: Require exact-head CI success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-ci-gate.sh "${{ github.repository }}" "$RELEASE_COMMIT"

      - name: Build dist assets
        run: |
          make dist \
            VERSION="${TAG_NAME#v}" \
            COMMIT="${RELEASE_COMMIT}" \
            BUILD_DATE="${RELEASE_BUILD_DATE}"

      - name: Verify release asset contract
        run: |
          bash scripts/release-contract.sh verify-dist dist "$TAG_NAME" "$RELEASE_COMMIT"
          bash scripts/release-contract.sh verify-candidate-tag . dist "$TAG_NAME"

      # Issue #212 未关闭前，stable 一律 fail closed；build job 不读取任何
      # signing/publish secret，仅允许 unsigned RC 进入跨 job artifact。
      - name: Block stable release until real signing is implemented
        if: steps.release.outputs.prerelease != 'true'
        run: |
          echo "::error::稳定 release $TAG_NAME 要求真实 codesign + notarization + spctl 验证（Issue #212）。请使用 prerelease tag。" >&2
          exit 1

      - name: Freeze verified release payload
        id: payload
        run: |
          tar -cf release-payload.tar dist
          payload_sha="$(sha256sum release-payload.tar | awk '{print $1}')"
          printf '%s  release-payload.tar\n' "$payload_sha" > RELEASE-PAYLOAD.sha256
          echo "sha256=$payload_sha" >> "$GITHUB_OUTPUT"

      - name: Upload digest-bound release payload
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-payload-${{ steps.release.outputs.source-head }}
          path: |
            release-payload.tar
            RELEASE-PAYLOAD.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish verified release candidate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
      EXPECTED_SOURCE_HEAD: ${{ needs.build.outputs.source-head }}
      EXPECTED_TAG_OBJECT: ${{ needs.build.outputs.tag-object }}
      EXPECTED_PAYLOAD_SHA256: ${{ needs.build.outputs.payload-sha256 }}
      IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Checkout exact release tag without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload-${{ needs.build.outputs.source-head }}
          path: release-artifact

      - name: Recheck tag and exact payload
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = "chiga0/marshal-harness"
          [[ "$EXPECTED_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git cat-file -t "refs/tags/${TAG_NAME}")" = tag
          test "$(git rev-parse --verify "refs/tags/${TAG_NAME}")" = "$EXPECTED_TAG_OBJECT"
          test "$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")" = "$EXPECTED_SOURCE_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test "$(sha256sum release-artifact/release-payload.tar | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          (cd release-artifact && sha256sum -c RELEASE-PAYLOAD.sha256)
          cat > expected-tar-files <<EOF
          dist/
          dist/RELEASE-MANIFEST
          dist/SHA256SUMS
          dist/marshal_${TAG_NAME#v}_darwin_amd64
          dist/marshal_${TAG_NAME#v}_darwin_arm64
          dist/marshal_${TAG_NAME#v}_linux_amd64
          dist/marshal_${TAG_NAME#v}_linux_arm64
          EOF
          tar -tf release-artifact/release-payload.tar | LC_ALL=C sort > actual-tar-files
          LC_ALL=C sort expected-tar-files -o expected-tar-files
          diff -u expected-tar-files actual-tar-files
          python3 -I -B - release-artifact/release-payload.tar "$TAG_NAME" <<'PY'
          import sys
          import tarfile

          archive, tag = sys.argv[1:]
          version = tag.removeprefix("v")
          expected = {
              "dist": ("directory", 0o755),
              "dist/RELEASE-MANIFEST": ("regular", 0o644),
              "dist/SHA256SUMS": ("regular", 0o644),
              f"dist/marshal_{version}_darwin_amd64": ("regular", 0o755),
              f"dist/marshal_{version}_darwin_arm64": ("regular", 0o755),
              f"dist/marshal_{version}_linux_amd64": ("regular", 0o755),
              f"dist/marshal_{version}_linux_arm64": ("regular", 0o755),
          }
          with tarfile.open(archive, mode="r:") as payload:
              members = payload.getmembers()
          if len(members) != 7 or {member.name for member in members} != set(expected):
              raise SystemExit("release payload must contain exactly seven canonical members")
          for member in members:
              expected_type, expected_mode = expected[member.name]
              actual_type = "directory" if member.isdir() else "regular" if member.isfile() else "other"
              if actual_type != expected_type or member.mode != expected_mode:
                  raise SystemExit(
                      f"unsafe payload member {member.name}: type={actual_type} mode={member.mode:o}"
                  )
              if expected_type == "regular" and (member.issym() or member.islnk() or member.linkname):
                  raise SystemExit(f"linked payload member rejected: {member.name}")
          PY
          mkdir release-payload
          tar -xf release-artifact/release-payload.tar -C release-payload
          (cd release-payload/dist && sha256sum -c SHA256SUMS)
          manifest_sha="$(sha256sum release-payload/dist/RELEASE-MANIFEST | awk '{print $1}')"
          candidate_sha="$(sha256sum "release-payload/dist/marshal_${TAG_NAME#v}_darwin_arm64" | awk '{print $1}')"
          git for-each-ref --format='%(contents)%1e' "refs/tags/${TAG_NAME}" > candidate-tag-message.raw
          test "$(wc -c < candidate-tag-message.raw | tr -d '[:space:]')" -le 65538
          marker="$(printf '\036')"
          awk -v tag="$TAG_NAME" -v commit="$EXPECTED_SOURCE_HEAD" -v manifest="$manifest_sha" -v candidate="$candidate_sha" -v marker="$marker" '
            NR == 1 { if ($0 != "Marshal " tag " candidate") exit 1; next }
            NR == 2 { if ($0 != "") exit 1; next }
            NR == 3 { if ($0 != "marshal-candidate-schema: v1") exit 1; next }
            NR == 4 { if ($0 != "marshal-candidate-source-head: " commit) exit 1; next }
            NR == 5 { if ($0 != "marshal-candidate-manifest-sha256: " manifest) exit 1; next }
            NR == 6 { if ($0 != "marshal-candidate-darwin-arm64-sha256: " candidate) exit 1; next }
            NR == 7 { if ($0 != marker) exit 1; seen_marker=1; next }
            { exit 1 }
            END { if (NR != 7 || !seen_marker) exit 1 }
          ' candidate-tag-message.raw
          awk -v tag="$TAG_NAME" -v commit="$EXPECTED_SOURCE_HEAD" '
            NR == 3 { if ($0 != "tag " tag) exit 1 }
            NR == 4 { if ($0 != "sourceHead " commit) exit 1 }
            END { if (NR != 11) exit 1 }
          ' release-payload/dist/RELEASE-MANIFEST

      - name: Generate release notes
        run: |
          {
            printf 'Marshal %s\n\n' "$TAG_NAME"
            printf '预编译资产（darwin/linux × amd64/arm64，CGO_ENABLED=0）。\n\n'
            printf -- '- **unsigned prerelease（Issue #212）**：macOS 签名/notarization 尚未落地，本资产不是稳定 v1 发布。\n'
            printf -- '- 安装脚本会对账 annotated tag、`RELEASE-MANIFEST`、`SHA256SUMS` 与二进制内嵌身份。\n'
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            --verify-tag \
            --title "Marshal $TAG_NAME" \
            --notes-file release-notes.md \
            "${args[@]}" \
            release-payload/dist/*
