name: Node team

on:
  pull_request:
    paths:
      - 'experiments/node-team/**'
      - 'packages/**'
      - '.github/workflows/node-team.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/node-team/**'
      - 'packages/**'
      - '.github/workflows/node-team.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-team-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Node team (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS 实测 750/750 通过耗时 578.752s，加 setup/cleanup 超过原 10m job 上限；不调整测试本身。
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      # Fixtures only: no provider login, model calls, Go build or Marshal native
      # executable. Files are serialized; each team still launches two workers.
      - name: Run formal Node packages and deterministic HTTP team regression
        run: >-
          node --test --test-concurrency=1
          packages/*/*.test.mjs
          experiments/node-team/providers.test.mjs
          experiments/node-team/business.test.mjs
          experiments/node-team/runtime.test.mjs
          experiments/node-team/http-handler.test.mjs
          experiments/node-team/http.test.mjs
          experiments/node-team/openapi.test.mjs

  package:
    name: Freeze one Node candidate
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source-head: ${{ steps.pack.outputs.source-head }}
      manifest-digest: ${{ steps.pack.outputs.manifest-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout tested source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Pack exactly once from the tested commit
        id: pack
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(id -u)" -ne 0
          test "$(node --version)" = v24.15.0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          candidate_parent="$(mktemp -d "$RUNNER_TEMP/marshal-node-candidate.XXXXXX")"
          node packages/task-distribution/main.mjs pack \
            --source "$GITHUB_WORKSPACE" --source-head "$GITHUB_SHA" \
            --target "$candidate_parent/package" > "$candidate_parent/report.json"
          node --input-type=module - "$candidate_parent" <<'NODE'
          import fs from 'node:fs';
          const parent = process.argv[2], report = JSON.parse(fs.readFileSync(parent + '/report.json'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'source-head=' + report.sourceHead + '\nmanifest-digest=' + report.manifestDigest + '\npackage-root=' + parent + '/package\n');
          console.log(JSON.stringify(report));
          NODE

      # The artifact is only a read-only carrier. ZIP may change permission
      # bits; consumers never execute it or chmod it into an installed package.
      - name: Upload the one digest-bound candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.pack.outputs.package-root }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  consume:
    name: Consume the same Node candidate (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      MARSHAL_CANDIDATE_SOURCE: ${{ needs.package.outputs.source-head }}
      MARSHAL_CANDIDATE_MANIFEST: ${{ needs.package.outputs.manifest-digest }}
      MARSHAL_CANDIDATE_ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
    steps:
      - name: Checkout matching trusted validators and external fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.source-head }}
          persist-credentials: false

      - name: Set up declared Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Download only the original producer artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/node-candidate-carrier

      - name: Validate the full carrier and exclusively install private bytes
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(id -u)" -ne 0
          test "$(node --version)" = v24.15.0
          test "$(git rev-parse HEAD)" = "$MARSHAL_CANDIDATE_SOURCE"
          install_parent="$(mktemp -d "$RUNNER_TEMP/marshal-node-installed.XXXXXX")"
          node packages/task-distribution/main.mjs restore-carrier \
            --carrier "$RUNNER_TEMP/node-candidate-carrier" --target "$install_parent/package" \
            --manifest-digest "$MARSHAL_CANDIDATE_MANIFEST" --source-head "$MARSHAL_CANDIDATE_SOURCE"
          echo "MARSHAL_CANDIDATE_ROOT=$install_parent/package" >> "$GITHUB_ENV"

      - name: Consume original installed CLI and client without repacking or models
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          node --test --test-concurrency=1 --test-reporter=tap \
            packages/task-distribution/candidate-consumer.mjs | tee "$RUNNER_TEMP/node-candidate-consumer.tap"
          node --input-type=module - "$RUNNER_TEMP/node-candidate-consumer.tap" <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync(process.argv[2], 'utf8');
          for (const expected of ['# tests 2', '# pass 2', '# fail 0', '# cancelled 0', '# skipped 0']) {
            if (!text.split(/\r?\n/).includes(expected)) throw Error('candidate_consumer_incomplete');
          }
          NODE

      # Keep the original layout1/2 consumer above. This additional v7 consumer
      # uses the same installed bytes and pins; it never creates another package.
      - name: Consume v7 Leader teams and publication from the same installed candidate
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          node --test --test-concurrency=1 --test-reporter=tap \
            packages/task-distribution/v7-candidate-consumer.mjs | tee "$RUNNER_TEMP/node-v7-consumer.tap"
          node --input-type=module - "$RUNNER_TEMP/node-v7-consumer.tap" "$RUNNER_TEMP/node-v7-consumer-result.json" <<'NODE'
          import fs from 'node:fs';
          import {candidateInputs, v7ResultFromTap} from './packages/task-distribution/v7-installed.fixture.mjs';
          const [input, output] = process.argv.slice(2);
          if (fs.statSync(input).size > 128 * 1024) throw Error('v7_consumer_output_limit');
          const result = v7ResultFromTap(fs.readFileSync(input, 'utf8'), candidateInputs(process.env));
          const fd = fs.openSync(output, fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_WRONLY | fs.constants.O_NOFOLLOW, 0o600);
          try {fs.writeFileSync(fd, JSON.stringify(result, null, 2) + '\n'); fs.fsyncSync(fd);} finally {fs.closeSync(fd);}
          NODE

      # Only the closed safe summary is archived. Private service roots, journals,
      # connection files and raw process output are never upload inputs.
      - name: Archive v7 same-candidate consumption summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-v7-consumption-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: ${{ runner.temp }}/node-v7-consumer-result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
