name: M13 e2e dogfood (published RC1)

on:
  workflow_dispatch:
    inputs:
      candidate-mode:
        description: candidate 获得方式：published-rc1=下载已发布资产（钉死 digest）；build-from-head=按 main HEAD 现场构建（用于验证修复）
        required: true
        default: published-rc1
        type: choice
        options:
          - published-rc1
          - build-from-head
      pi-model:
        description: provider/model（缺省以 pai-eas 结合 vars.OPENAI_MODELS 第一项）
        required: false
        type: string
      task-run-id:
        description: Marshall Run ID（缺省 m13-goal-lite-walking-skeleton-<yyyymmdd>）
        required: false
        type: string
      reviewer-id:
        description: 独立 ReviewDecision 的 reviewer id
        required: false
        default: e2e-operator-runner
        type: string
      expected-candidate-sha256:
        description: published-rc1 模式下已发布 candidate 的精确 sha256（防漂移）
        required: true
        default: f9ed7fa59d05f5e71fef7164b8015240497e1d18e25ef1d3f8e199c1378a3774
        type: string

permissions:
  contents: read

concurrency:
  group: m13-e2e-dogfood-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dogfood:
    name: M13 GoalLite dogfood on published RC1
    runs-on: macos-14
    timeout-minutes: 80
    permissions:
      contents: read
    env:
      PI_MODEL: ${{ inputs.pi-model }}
      PI_DEFAULT_PROVIDER: "pai-eas"
      PHY_PI_VERSION: "0.84.4"
      PHY_NODE_VERSION: "v24.15.0"
      PHY_NODE_SHA256: "3200fbd9f7fd4410426dd541e10d1ab829d3472f270d743c7fabd1696c03fe32"
      PHY_PI_BUNDLE_SHA256: "5406c369954516fb56879d685e082ff9095cd6e06e41af406f394942377fd4bf"
      TASK_ID: "m13-goal-lite-walking-skeleton-20260901"
      EXPECTED_CANDIDATE_SHA256: ${{ inputs.expected-candidate-sha256 }}
    steps:
      - name: Validate inputs and resolve identities
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          REVIEWER_ID: ${{ inputs.reviewer-id }}
          INPUT_RUN_ID: ${{ inputs.task-run-id }}
          VARS_MODELS: ${{ vars.OPENAI_MODELS }}
        run: |
          test "${{ github.repository }}" = "chiga0/marshal-harness" || { echo "::error::仅允许 canonical 仓库" >&2; exit 1; }
          first_model="$(/usr/bin/python3 -I -B -c 'import os,re,sys; items=[m.strip() for m in os.environ.get("VARS_MODELS", "").split(",") if m.strip()]; (items and all(re.fullmatch(r"[A-Za-z0-9._:-]+", m) for m in items)) or sys.exit("OPENAI_MODELS 必须是逗号分隔的裸 model id"); print(items[0])' 2>&1)" || { echo "::error::$first_model" >&2; exit 1; }
          model="$PI_MODEL"
          if [ -z "$model" ]; then
            [[ "$PI_DEFAULT_PROVIDER" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "::error::默认 Pi provider identity 形态非法" >&2; exit 1; }
            model="$PI_DEFAULT_PROVIDER/$first_model"
          fi
          [[ "$model" =~ ^[A-Za-z0-9._:-]+/[A-Za-z0-9._:-]+$ ]] || { echo "::error::pi-model 必须是 provider/model 形状：$model" >&2; exit 1; }
          model_id="${model#*/}"
          VARS_MODELS="$VARS_MODELS" MODEL_ID="$model_id" /usr/bin/python3 -I -B -c 'import os,sys; items=[m.strip() for m in os.environ["VARS_MODELS"].split(",") if m.strip()]; os.environ["MODEL_ID"] in items or sys.exit("pi-model 的 model 段不在 OPENAI_MODELS 中")'
          [[ "$EXPECTED_CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::candidate sha256 形态非法" >&2; exit 1; }
          [[ "$REVIEWER_ID" =~ ^[A-Za-z0-9._-]{2,64}$ ]] || { echo "::error::reviewer-id 形态非法" >&2; exit 1; }
          run_id="$INPUT_RUN_ID"
          [ -n "$run_id" ] || run_id="m13-goal-lite-walking-skeleton-$(date -u +%Y%m%d)"
          [[ "$run_id" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,120}$ ]] || { echo "::error::task-run-id 形态非法：$run_id" >&2; exit 1; }
          printf 'PI_MODEL=%s\n' "$model" >> "$GITHUB_ENV"
          printf 'RUN_ID=%s\n' "$run_id" >> "$GITHUB_ENV"
          printf 'REVIEWER_ID=%s\n' "$REVIEWER_ID" >> "$GITHUB_ENV"

      - name: Checkout main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository and CI pre-gate
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://github.com/chiga0/marshal-harness.git
          head="$(git rev-parse HEAD)"
          bash scripts/release-ci-gate.sh "${{ github.repository }}" "$head"
          printf 'MAIN_HEAD=%s\n' "$head" >> "$GITHUB_ENV"

      - name: Download and verify the published RC1 candidate (published-rc1 mode)
        if: inputs.candidate-mode == 'published-rc1'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf dist && mkdir -p dist bin
          gh release download v1.0.0-rc1 --repo "${{ github.repository }}" \
            --pattern 'marshal_1.0.0-rc1_darwin_arm64' --dir dist --clobber
          gh release download v1.0.0-rc1 --repo "${{ github.repository }}" \
            --pattern 'RELEASE-MANIFEST' --dir dist --clobber
          asset_sha="$(shasum -a 256 dist/marshal_1.0.0-rc1_darwin_arm64 | awk '{print tolower($1)}')"
          [ "$asset_sha" = "$EXPECTED_CANDIDATE_SHA256" ] || { echo "::error::已发布 candidate digest 漂移：$asset_sha" >&2; exit 1; }
          cp dist/marshal_1.0.0-rc1_darwin_arm64 bin/marshal
          chmod 755 bin/marshal
          [ ! -L bin/marshal ]
          version_json="$(bin/marshal version --json)"
          VERSION_JSON="$version_json" /usr/bin/python3 -I -B -c 'import json, os; v = json.loads(os.environ["VERSION_JSON"]); assert v.get("commit") == "c1407bd77924c97dc6784f4d81938a3f0bfa75f6", v; assert v.get("version") == "1.0.0-rc1", v; assert v.get("selfProfile") == "darwin-local-dogfood", v; assert v.get("os") == "darwin", v; print("published candidate identity verified")'
          printf 'MARSHAL_BIN=%s\n' "$(pwd)/bin/marshal" >> "$GITHUB_ENV"

      - name: Provision pinned Go 1.26.6 toolchain (build-from-head mode)
        if: inputs.candidate-mode == 'build-from-head'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GO_TARBALL_URL: https://mirror.nju.edu.cn/golang/go1.26.6.darwin-arm64.tar.gz
          GO_TARBALL_NAME: go1.26.6.darwin-arm64.tar.gz
          GO_TARBALL_SHA256: 2dc95ce4675829f2df0e86b28bcef3283635902062a5f0580ca659bf570f3204
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          curl -fsSLo "$root/go.tar.gz" "$GO_TARBALL_URL"
          dl_sha="$(shasum -a 256 "$root/go.tar.gz" | awk '{print tolower($1)}')"
          [ "$dl_sha" = "$GO_TARBALL_SHA256" ] || { echo "::error::go tarball digest 漂移：$dl_sha" >&2; exit 1; }
          /usr/bin/tar -xzf "$root/go.tar.gz" -C "$root"
          go_bin="$root/go/bin/go"
          got_version="$("$go_bin" version | awk '{print $3}')"
          [ "$got_version" = "go1.26.6" ] || { echo "::error::go toolchain 版本漂移：$got_version" >&2; exit 1; }
          printf 'MARSHAL_RELEASE_CANARY_GO_BIN=%s\n' "$go_bin" >> "$GITHUB_ENV"

      - name: Build candidate from main head (build-from-head mode)
        if: inputs.candidate-mode == 'build-from-head'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          rm -rf dist && mkdir -p bin
          "$MARSHAL_RELEASE_CANARY_GO_BIN" version
          make dist-rc1 GO="$MARSHAL_RELEASE_CANARY_GO_BIN" VERSION="1.0.0-rc1" \
            COMMIT="$MAIN_HEAD" BUILD_DATE="$(bash scripts/release-contract.sh build-date . "$MAIN_HEAD")"
          ls -la dist/
          candidate="$(ls dist/marshal_*_darwin_arm64 2>/dev/null | head -1)"
          [ -n "$candidate" ] || { echo "::error::dist 无 darwin_arm64 candidate" >&2; exit 1; }
          cp "$candidate" bin/marshal
          chmod 755 bin/marshal
          [ ! -L bin/marshal ]
          version_json="$(bin/marshal version --json)"
          VERSION_JSON="$version_json" EXPECTED_HEAD="$MAIN_HEAD" /usr/bin/python3 -I -B -c 'import json, os; v = json.loads(os.environ["VERSION_JSON"]); assert v.get("commit") == os.environ["EXPECTED_HEAD"], (v, os.environ["EXPECTED_HEAD"]); assert v.get("selfProfile") == "darwin-local-dogfood", v; assert v.get("os") == "darwin", v; print("head-built candidate identity verified:", v.get("version"))'
          printf 'MARSHAL_BIN=%s\n' "$(pwd)/bin/marshal" >> "$GITHUB_ENV"

      - name: Provision pinned Node v24.15.0 + Pi 0.84.4 with digest assertions
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          root="$RUNNER_WORKSPACE/pi-provision"
          rm -rf "$root" && mkdir -p "$root"
          curl -fsSLo "$root/node.tar.gz" "https://nodejs.org/dist/${PHY_NODE_VERSION}/node-${PHY_NODE_VERSION}-darwin-arm64.tar.gz"
          /usr/bin/tar -xzf "$root/node.tar.gz" -C "$root"
          node_root="$root/node-${PHY_NODE_VERSION}-darwin-arm64"
          node_sha="$(shasum -a 256 "$node_root/bin/node" | awk '{print tolower($1)}')"
          [ "$node_sha" = "${PHY_NODE_SHA256}" ] || { echo "::error::provisioned node digest 漂移 $node_sha" >&2; exit 1; }
          [ "$("$node_root/bin/node" --version)" = "${PHY_NODE_VERSION}" ] || { echo "::error::provisioned node 版本漂移" >&2; exit 1; }
          export PATH="$node_root/bin:$PATH"
          npm install --global --no-fund --no-audit @earendil-works/pi-coding-agent@${PHY_PI_VERSION}
          pi_wrapper="$(command -v pi)"
          [ -L "$pi_wrapper" ] || { echo "::error::pi 入口不是符号链接：$pi_wrapper" >&2; exit 1; }
          bundle="$(/usr/bin/readlink "$pi_wrapper")"
          case "$bundle" in /*) ;; *) bundle="$(dirname "$pi_wrapper")/$bundle" ;; esac
          bundle="$(/usr/bin/python3 -I -B -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$bundle")"
          case "$bundle" in */@earendil-works/pi-coding-agent/dist/bundle/cli.js) ;; *) echo "::error::bundle 路径形态漂移 $bundle" >&2; exit 1 ;; esac
          bundle_sha="$(shasum -a 256 "$bundle" | awk '{print tolower($1)}')"
          [ "$bundle_sha" = "${PHY_PI_BUNDLE_SHA256}" ] || { echo "::error::provisioned bundle digest 漂移 $bundle_sha" >&2; exit 1; }
          [ "$(env -i HOME="$HOME" "$node_root/bin/node" "$bundle" --version)" = "${PHY_PI_VERSION}" ] || { echo "::error::pi --version 失败或漂移" >&2; exit 1; }
          printf 'PI_NODE=%s\n' "$node_root/bin/node" >> "$GITHUB_ENV"
          printf 'PI_BIN=%s\n' "$pi_wrapper" >> "$GITHUB_ENV"
          printf 'PI_BUNDLE=%s\n' "$bundle" >> "$GITHUB_ENV"
          printf 'NODE_ROOT_BIN=%s\n' "$node_root/bin" >> "$GITHUB_ENV"

      - name: Provision Pi provider config (no secret echoed)
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODELS: ${{ vars.OPENAI_MODELS }}
        run: |
          [ -n "$OPENAI_BASE_URL" ] && [ -n "$OPENAI_API_KEY" ] && [ -n "$OPENAI_MODELS" ] || {
            echo "::error::缺少 OPENAI_BASE_URL/OPENAI_API_KEY/OPENAI_MODELS secrets" >&2; exit 1; }
          mkdir -p "$HOME/.pi/agent"
          chmod 700 "$HOME/.pi" "$HOME/.pi/agent"
          python3 -I -B scripts/rc1-canary-provider-config.py \
            "$HOME/.pi/agent/models.json" "$OPENAI_BASE_URL" "${PI_MODEL%%/*}"

      - name: Issue dogfood activation and initialize control state
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          [ -n "$MARSHAL_BIN" ] && [ -x "$MARSHAL_BIN" ]
          control_root="$(pwd)/.m13-e2e"
          rm -rf "$control_root" && mkdir -p "$control_root"
          "$MARSHAL_BIN" doctor --self --repository-root "$(pwd)" \
            --activation-id "m13-e2e-${{ github.run_id }}" > "$control_root/activation.json"
          /usr/bin/python3 -I -B -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("schemaVersion") == "marshal.local-dogfood-activation.v2"; assert d.get("expectedRawSHA256") == sys.argv[2], (d.get("expectedRawSHA256"), sys.argv[2])' \
            "$control_root/activation.json" "sha256:$(shasum -a 256 bin/marshal | awk '{print tolower($1)}')"
          export MARSHAL_LOCAL_DOGFOOD_ACTIVATION="$control_root/activation.json"
          printf 'MARSHAL_LOCAL_DOGFOOD_ACTIVATION=%s\n' "$MARSHAL_LOCAL_DOGFOOD_ACTIVATION" >> "$GITHUB_ENV"
          "$MARSHAL_BIN" init --json > "$control_root/init.json"
          "$MARSHAL_BIN" doctor --json > "$control_root/doctor.json"
          printf 'CONTROL_ROOT=%s\n' "$control_root" >> "$GITHUB_ENV"

      - name: Render M13 TaskSpec and PolicySnapshot
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          base_ref="ff8cc3bbebf27ab435eadd2ad0372b050b35fda2"
          git cat-file -e "${base_ref}^{commit}" || { echo "::error::base ref 不在 clone 中" >&2; exit 1; }
          python3 -I -B scripts/e2e-m13-dogfood.py render-task \
            --doctor "$CONTROL_ROOT/doctor.json" \
            --repo-root "$(pwd)" \
            --base-ref "$base_ref" \
            --task-id "$TASK_ID" --run-id "$RUN_ID" \
            --model "$PI_MODEL" --marshal-bin "$MARSHAL_BIN" \
            --task-out "$CONTROL_ROOT/task.json" --policy-out "$CONTROL_ROOT/policy.json"

      - name: Plan and approve the M13 run
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          # RB1 existing-worktree bind admission 要求 worktree 根恰好 0700：
          # 与 release-canary.sh 一致，整个 dogfood 链一律在 umask 077 下运行。
          umask 077
          export PATH="$NODE_ROOT_BIN:/usr/bin:/bin:/usr/sbin:/sbin"
          export MARSHAL_PI_PATH="$PI_BIN" MARSHAL_PI_NODE_PATH="$PI_NODE"
          export MARSHAL_PI_RUNTIME="$PI_NODE" MARSHAL_PI_ENTRYPOINT="$PI_BUNDLE"
          printf 'WALL_START=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          "$MARSHAL_BIN" task plan --task "$CONTROL_ROOT/task.json" --policy "$CONTROL_ROOT/policy.json" \
            --run "$RUN_ID" --json > "$CONTROL_ROOT/plan.json"
          "$MARSHAL_BIN" task approve --run "$RUN_ID" --gate plan --actor "github-actions[e2e-operator]" \
            --json > "$CONTROL_ROOT/approve.json"

      - name: Drive the sealed run to worker completion
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          export PATH="$NODE_ROOT_BIN:/usr/bin:/bin:/usr/sbin:/sbin"
          export MARSHAL_PI_PATH="$PI_BIN" MARSHAL_PI_NODE_PATH="$PI_NODE"
          export MARSHAL_PI_RUNTIME="$PI_NODE" MARSHAL_PI_ENTRYPOINT="$PI_BUNDLE"
          wait_args=()
          if [ "${{ inputs.candidate-mode }}" = "build-from-head" ]; then
            wait_args=(--wait)
          fi
          "$MARSHAL_BIN" task run --run "$RUN_ID" "${wait_args[@]}" --json > "$CONTROL_ROOT/run-start.json" 2>&1 || {
            cat "$CONTROL_ROOT/run-start.json" >&2; exit 1; }
          cat "$CONTROL_ROOT/run-start.json"
          if [ "${{ inputs.candidate-mode }}" = "build-from-head" ]; then
            state="$("$MARSHAL_BIN" task status --run "$RUN_ID" --json 2>/dev/null | /usr/bin/python3 -I -B -c 'import json,sys; print(json.load(sys.stdin).get("state", ""))' 2>/dev/null)"
            [ "$state" = VERIFYING ] || { echo "::error::--wait 返回后 Run 未到达 VERIFYING：$state" >&2; exit 1; }
            echo "run reached VERIFYING with one owner successor and one resident supervisor session"
            exit 0
          fi
          # READY 只启动 sealed Attempt；后续 RUNNING 调用等价于一次有界 collect：
          # attempt 未终态时立即返回，需要与 release-canary.sh 相同的轮询节奏。
          collect_attempt=0
          while :; do
            state="$("$MARSHAL_BIN" task status --run "$RUN_ID" --json 2>/dev/null | /usr/bin/python3 -I -B -c 'import json,sys; print(json.load(sys.stdin).get("state", ""))' 2>/dev/null)"
            case "$state" in
              VERIFYING) echo "run reached VERIFYING after $collect_attempt collect rounds"; break ;;
              READY|RUNNING)
                collect_attempt=$((collect_attempt + 1))
                [ "$collect_attempt" -le 1000 ] || { echo "::error::Attempt 在 1000 次有界收集内未到达 VERIFYING" >&2; tail -40 "$CONTROL_ROOT/run-drive.log" 2>/dev/null >&2; exit 1; }
                "$MARSHAL_BIN" task run --run "$RUN_ID" --json >> "$CONTROL_ROOT/run-drive.log" 2>&1 || { echo "::error::collect 调用失败（第 $collect_attempt 轮）" >&2; tail -40 "$CONTROL_ROOT/run-drive.log" 2>/dev/null >&2; exit 1; }
                sleep 1
                ;;
              *) echo "::error::run 进入意外状态：$state" >&2; exit 1 ;;
            esac
          done

      - name: Run independent verification
        id: independent_verification
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          export PATH="$NODE_ROOT_BIN:/usr/bin:/bin:/usr/sbin:/sbin"
          verify_stderr="${RUNNER_TEMP:?}/m13-verify.stderr"
          verify_rc=0
          "$MARSHAL_BIN" task verify --run "$RUN_ID" --json \
            > "$CONTROL_ROOT/verify.json" 2> "$verify_stderr" || verify_rc=$?
          status_rc=0
          "$MARSHAL_BIN" task status --run "$RUN_ID" --json \
            > "$CONTROL_ROOT/status-review-pending.json" 2>/dev/null || status_rc=$?
          VERIFY_REPORT="$CONTROL_ROOT/verify.json" /usr/bin/python3 -I -B <<'PY'
          import json
          import os

          REPORT_STATUSES = frozenset(("pass", "fail", "error", "cancelled"))
          GATE_CATEGORIES = frozenset(("repository", "scope", "diff", "artifact", "command", "policy", "other"))
          MAX_COUNT = 1_000_000
          MAX_DIFF_BYTES = 1 << 40

          def bounded_count(value, ceiling):
              if isinstance(value, bool) or not isinstance(value, int) or value < 0:
                  return 0
              return min(value, ceiling)

          report = {}
          try:
              with open(os.environ["VERIFY_REPORT"], encoding="utf-8") as handle:
                  loaded = json.load(handle)
              if isinstance(loaded, dict):
                  report = loaded
          except (OSError, UnicodeError, json.JSONDecodeError):
              pass
          observed = report.get("observed") if isinstance(report.get("observed"), dict) else {}
          failed = []
          gates = report.get("gates") if isinstance(report.get("gates"), list) else []
          failed_count = 0
          for ordinal, gate in enumerate(gates, start=1):
              if not isinstance(gate, dict):
                  continue
              raw_status = gate.get("status")
              if raw_status in ("pass", "skipped", "cancelled"):
                  continue
              failed_count += 1
              if len(failed) == 20:
                  continue
              category = gate.get("category")
              failed.append({
                  "ordinal": bounded_count(ordinal, MAX_COUNT),
                  "category": category if isinstance(category, str) and category in GATE_CATEGORIES else "other",
                  "status": raw_status if raw_status in ("fail", "error") else "error",
              })
          report_status = report.get("status")
          summary = {
              "reportStatus": report_status if isinstance(report_status, str) and report_status in REPORT_STATUSES else "unavailable",
              "observed": {
                  "changedFileCount": bounded_count(observed.get("changedFileCount"), MAX_COUNT),
                  "diffBytes": bounded_count(observed.get("diffBytes"), MAX_DIFF_BYTES),
              },
              "failedGates": failed,
              "failedGateCount": bounded_count(failed_count, MAX_COUNT),
              "failedGatesTruncated": len(failed) < failed_count,
          }
          print(json.dumps(summary, ensure_ascii=True, separators=(",", ":")))
          PY
          if [ "$verify_rc" -ne 0 ]; then
            exit "$verify_rc"
          fi
          if [ "$status_rc" -ne 0 ]; then
            exit "$status_rc"
          fi
          /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(open(sys.argv[1])).get("state") == "REVIEW_PENDING"' "$CONTROL_ROOT/status-review-pending.json"

      - name: Build independent ReviewDecision from the generated packet
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          export PATH="$NODE_ROOT_BIN:/usr/bin:/bin:/usr/sbin:/sbin"
          "$MARSHAL_BIN" task review --run "$RUN_ID" --json > "$CONTROL_ROOT/review-packet-step.json"
          /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(open(sys.argv[1])).get("status") == "generated"' "$CONTROL_ROOT/review-packet-step.json"
          packet_file=".marshal/runs/${RUN_ID}/review-packet.json"
          [ -f "$packet_file" ] || { echo "::error::缺少 review-packet.json" >&2; exit 1; }
          python3 -I -B scripts/e2e-m13-dogfood.py render-decision \
            --packet "$packet_file" --task-id "$TASK_ID" --run-id "$RUN_ID" \
            --reviewer-id "$REVIEWER_ID" \
            --summary "M13 GoalLite walking skeleton 文档与样例满足 scope/acceptance 全部证据面，独立核验通过，接受本 reworkRound 的产物。" \
            --out "$CONTROL_ROOT/decision.json"

      - name: Apply decision and expect ACCEPTED
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          export PATH="$NODE_ROOT_BIN:/usr/bin:/bin:/usr/sbin:/sbin"
          "$MARSHAL_BIN" task review --run "$RUN_ID" --decision "$CONTROL_ROOT/decision.json" --json \
            > "$CONTROL_ROOT/review.json"
          "$MARSHAL_BIN" task status --run "$RUN_ID" --json > "$CONTROL_ROOT/status-accepted.json"
          /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(open(sys.argv[1])).get("state") == "ACCEPTED"' "$CONTROL_ROOT/status-accepted.json"

      - name: Extract token and time metrics
        if: always()
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          control_root="${CONTROL_ROOT:-$(pwd)/.m13-e2e}"
          run_id="${RUN_ID:-}"
          mkdir -p "$control_root"
          if [ -n "$run_id" ] && [ -f ".marshal/runs/${run_id}/state.json" ]; then
            python3 -I -B scripts/e2e-m13-dogfood.py metrics \
              --state-root .marshal --run-id "$run_id" --wall-start "${WALL_START:-}" \
              --out "$control_root/metrics.json"
          else
            echo '[e2e-m13] run state 未生成，跳过指标提取（链路未到达 run 阶段）'
          fi

      - name: Pack dogfood evidence tarball
        if: always()
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          members=""
          if [ -d .marshal ]; then members=".marshal"; fi
          if [ -d .m13-e2e ]; then members="$members .m13-e2e"; fi
          if [ -n "$members" ]; then
            /usr/bin/tar \
              --exclude 'runs/*/lease.lock' \
              --exclude 'runs/*/lease.lock.owner' \
              -czf m13-dogfood-evidence.tar.gz $members
          else
            echo 'no dogfood evidence to pack'
          fi
          ls -la m13-dogfood-evidence.tar.gz 2>/dev/null || true

      - name: Upload dogfood evidence
        if: always()
        continue-on-error: ${{ steps.independent_verification.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m13-dogfood-${{ github.run_id }}
          path: |
            m13-dogfood-evidence.tar.gz
            dist/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          include-hidden-files: true

      - name: Write metrics summary
        if: always() && hashFiles('.m13-e2e/metrics.json') != ''
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          control_root="${CONTROL_ROOT:-$(pwd)/.m13-e2e}"
          run_id="${RUN_ID:-unresolved}"
          pi_model="${PI_MODEL:-unresolved}"
          {
            echo "# M13 GoalLite dogfood 指标（published RC1）"
            echo
            echo "- run id: \`$run_id\`"
            echo "- model: \`$pi_model\`"
            echo
            echo '```json'
            cat "$control_root/metrics.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
