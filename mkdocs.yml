site_name: Marshal Harness
site_description: 面向 Agent 软件工程的长寿命确定性 Control Plane / Durable deterministic control plane for agentic software engineering
site_url: https://chiga0.github.io/marshal-harness/
repo_url: https://github.com/chiga0/marshal-harness
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  adr/*.md
  en/*.md
  en/adr/*.md
  research/*.md
  reviews/*.md
  archive.md
  architecture.md
  artifact-and-publishing.md
  audit-report.md
  compatibility-matrix.md
  development.md
  environment-baseline.md
  failure-and-recovery.md
  implementation-plan.md
  lead-agent-surfaces.md
  milestone-*.md
  operator-runbook.md
  reference.md
  roadmap-status.md
  runtime-architecture.md
  security-model.md
  task-contract.md
  task-lifecycle.md
  verification-and-review.md
  vision-and-scope.md
  worker-adapters.md
  worker-adapter-spike.md
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换暗色
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换亮色
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
plugins:
  - search:
      lang:
        - en
        - zh
extra:
  alternate:
    - name: 中文
      link: https://chiga0.github.io/marshal-harness/
      lang: zh
    - name: English
      link: https://chiga0.github.io/marshal-harness/en/
      lang: en
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
nav:
  - 开始:
      - 首页: index.md
      - Marshal 是什么: concepts.md
      - 当前可用能力: current-status.md
      - 快速开始: getting-started.md
  - 使用 Marshal:
      - 日常使用: usage.md
      - 在 Codex 中使用: marshal-skill.md
  - 了解设计:
      - 工作原理: how-it-works.md
      - 安全与隐私: security.md
