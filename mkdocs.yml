site_name: Marshal
site_description: 可自托管的 Agent Team 服务：从需求、独立验收到受控交付
site_url: https://chiga0.github.io/marshal-harness/
repo_url: https://github.com/chiga0/marshal-harness
edit_uri: ''
docs_dir: .marshal/docs-source
site_dir: .marshal/docs-site
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换暗色
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换亮色
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
plugins:
  - search:
      lang: [en, zh]
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
nav:
  - 产品:
      - 首页: index.md
      - 愿景与适用范围: vision-and-scope.md
  - 使用:
      - 快速开始: getting-started.md
      - 下载与安装: node-install.md
      - 版本与接口支持: api-support.md
  - 架构与设计:
      - 目标架构与取舍: agent-team-service-architecture.md
      - 任务生命周期: task-lifecycle.md
      - Leader 与独立验收: node-leader-execution-design.md
      - 安全与信任边界: security-model.md
  - 标准 API 与扩展:
      - 契约总览: standard-api.md
      - HTTP 操作与 Schema: api/http-reference.md
      - Agent、环境与业务扩展: extension-contracts.md
      - Leader 机器契约: node-leader-execution-contract.md
  - 路线与进展:
      - 实施 Milestone: agent-team-service-milestones.md
      - 实际进展: roadmap-status.md
      - 设计决策与历史: design-contract-map.md
  - 文档维护:
      - 维护与发布: documentation-guide.md
      - 测试与验收: testing/business-postconditions.md
      - 构建来源: build-info.md
