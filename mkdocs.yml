site_name: Marshal Harness
site_description: 面向 Agent 软件工程的长寿命确定性 Control Plane / Durable deterministic control plane for agentic software engineering
site_url: https://chiga0.github.io/marshal-harness/
repo_url: https://github.com/chiga0/marshal-harness
edit_uri: edit/main/docs/
docs_dir: docs
not_in_nav: |
  adr/*.md
  en/*.md
  en/adr/*.md
  research/*.md
  reviews/*.md
  archive.md
  artifact-and-publishing.md
  audit-report.md
  compatibility-matrix.md
  environment-baseline.md
  failure-and-recovery.md
  lead-agent-surfaces.md
  milestone-*.md
  task-contract.md
  task-lifecycle.md
  verification-and-review.md
  vision-and-scope.md
  worker-adapter-spike.md
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换暗色
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换亮色
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
plugins:
  - search:
      lang:
        - en
        - zh
extra:
  alternate:
    - name: 中文
      link: https://chiga0.github.io/marshal-harness/
      lang: zh
    - name: English
      link: https://chiga0.github.io/marshal-harness/en/
      lang: en
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
nav:
  - 开始:
      - 首页: index.md
      - 快速开始: getting-started.md
      - 当前能力与 Roadmap: roadmap-status.md
  - 理解 Marshal:
      - 核心概念: concepts.md
      - 整体架构: architecture.md
      - Runtime 架构: runtime-architecture.md
      - 安全模型: security-model.md
  - 使用 Marshal:
      - 操作手册: operator-runbook.md
      - Codex Skill: marshal-skill.md
  - 构建与扩展:
      - 开发指南: development.md
      - Worker Adapter: worker-adapters.md
      - 实施计划: implementation-plan.md
  - 更多资料:
      - 参考索引: reference.md
